[project]
name = "wb2canvas"
version = "0.0.1"
description = "Export Atlassian Confluence Whiteboards to JSON Canvas 1.0"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Srdan Srepfler" }]
dependencies = [
    "playwright>=1.49.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "pydantic>=2.9.0",
    "platformdirs>=4.3.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
wb2canvas = "wb2canvas.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wb2canvas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
