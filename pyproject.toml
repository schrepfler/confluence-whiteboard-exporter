[project]
name = "confluence-whiteboard-exporter"
version = "0.0.1"
description = "Export Confluence Cloud whiteboards to JSON Canvas, SVG and an interactive HTML viewer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Srdan Srepfler" }]
dependencies = [
    "playwright>=1.49.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "pydantic>=2.9.0",
    "platformdirs>=4.3.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
confluence-whiteboard-exporter = "confluence_whiteboard_exporter.cli:run"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["confluence_whiteboard_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
